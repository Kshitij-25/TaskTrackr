name: tasktrackr
description: "TaskTrackr — a productivity OS built on momentum: tasks, habits, focus and streaks."
publish_to: 'none'
version: 2.0.0+3

environment:
  sdk: '>=3.4.1 <4.0.0'

dependencies:
  cloud_firestore: ^6.10.0
  cupertino_icons: ^2.0.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  go_router: ^18.0.2
  google_fonts: ^9.0.0
  google_sign_in: ^7.2.0
  hooks_riverpod: ^3.4.3
  intl: ^0.20.3
  path_provider: ^2.0.15
  svg_flutter: ^0.0.1
  uuid: ^4.4.0
  image_picker: ^1.1.2
  firebase_storage: ^13.6.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/