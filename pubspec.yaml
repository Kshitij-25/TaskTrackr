name: tasktrackr
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.4.1 <4.0.0'

dependencies:
  cloud_firestore: ^5.0.2
  cupertino_icons: ^1.0.5
  firebase_auth: ^5.1.1
  firebase_core: ^3.1.1
  flutter:
    sdk: flutter
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.1
  hooks_riverpod: ^2.5.1
  intl: ^0.19.0
  path_provider: ^2.0.15
  svg_flutter: ^0.0.1
  uuid: ^4.4.0
  image_picker: ^1.1.2
  firebase_storage: ^12.1.0
  firebase_messaging: ^15.0.3
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.6
  

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/